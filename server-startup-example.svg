<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">MCP Security Sanitizer server startup terminal example</title>
  <desc id="desc">Illustrative PowerShell terminal showing the expected FastMCP server startup command and SSE listening endpoint.</desc>
  <rect width="1200" height="430" fill="#0d1117"/>
  <text x="42" y="52" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">MCP Security Sanitizer — server startup</text>
  <text x="42" y="82" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="15">Illustrative terminal screenshot; timestamps and process IDs vary.</text>
  <rect x="40" y="110" width="1120" height="280" rx="10" fill="#161b22" stroke="#30363d"/>
  <path d="M40 120a10 10 0 0 1 10-10h1100a10 10 0 0 1 10 10v32H40z" fill="#21262d"/>
  <circle cx="62" cy="132" r="6" fill="#ff7b72"/>
  <circle cx="84" cy="132" r="6" fill="#d29922"/>
  <circle cx="106" cy="132" r="6" fill="#3fb950"/>
  <text x="132" y="137" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="15">Windows PowerShell — server terminal</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="17">
    <text x="64" y="188" fill="#c9d1d9">PS&gt; uv run server.py</text>
    <text x="64" y="228" fill="#8b949e">INFO Starting MCP server 'MCP Security Sanitizer'</text>
    <text x="64" y="254" fill="#8b949e">     with transport 'sse' on http://127.0.0.1:8000/sse</text>
    <text x="64" y="294" fill="#8b949e">INFO:     Started server process [process-id]</text>
    <text x="64" y="320" fill="#8b949e">INFO:     Waiting for application startup.</text>
    <text x="64" y="346" fill="#8b949e">INFO:     Application startup complete.</text>
    <text x="64" y="372" fill="#7ee787">INFO:     Uvicorn running on http://127.0.0.1:8000</text>
  </g>
</svg>
