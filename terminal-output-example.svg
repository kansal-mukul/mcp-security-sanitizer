<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Example MCP server and sanitizer client terminal output</title>
  <desc id="desc">Illustrative terminal output showing the MCP server startup and a client-side sanitizer call. No Groq response is included.</desc>
  <rect width="1200" height="720" fill="#0d1117"/>
  <text x="42" y="52" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">MCP Security Sanitizer — example terminal output</text>
  <text x="42" y="82" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="15">Illustrative view, not a raw desktop screenshot. Values shown are synthetic.</text>

  <rect x="40" y="112" width="1120" height="190" rx="10" fill="#161b22" stroke="#30363d"/>
  <path d="M40 122a10 10 0 0 1 10-10h1100a10 10 0 0 1 10 10v30H40z" fill="#21262d"/>
  <circle cx="62" cy="132" r="6" fill="#ff7b72"/>
  <circle cx="84" cy="132" r="6" fill="#d29922"/>
  <circle cx="106" cy="132" r="6" fill="#3fb950"/>
  <text x="132" y="137" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="15">Terminal 1 — MCP server</text>
  <g fill="#c9d1d9" font-family="Consolas, 'Courier New', monospace" font-size="17">
    <text x="64" y="184">PS&gt; uv run server.py</text>
    <text x="64" y="216" fill="#8b949e">INFO Starting MCP server 'MCP Security Sanitizer'</text>
    <text x="64" y="240" fill="#8b949e">     transport 'sse' on http://127.0.0.1:8000/sse</text>
    <text x="64" y="264" fill="#8b949e">INFO: Application startup complete.</text>
  </g>

  <rect x="40" y="326" width="1120" height="350" rx="10" fill="#161b22" stroke="#30363d"/>
  <path d="M40 336a10 10 0 0 1 10-10h1100a10 10 0 0 1 10 10v30H40z" fill="#21262d"/>
  <circle cx="62" cy="346" r="6" fill="#ff7b72"/>
  <circle cx="84" cy="346" r="6" fill="#d29922"/>
  <circle cx="106" cy="346" r="6" fill="#3fb950"/>
  <text x="132" y="351" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="15">Terminal 2 — client sanitizer check (Groq not called)</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="16">
    <text x="64" y="398" fill="#c9d1d9">Secure assistant ready. Type 'exit' or 'quit' to stop.</text>
    <text x="64" y="430" fill="#c9d1d9">You: Contact alex@example.com at (415) 555-0134;</text>
    <text x="64" y="454" fill="#c9d1d9">     test key sk-1234567890abcdef.</text>
    <text x="64" y="494" fill="#79c0ff">[MCP] Calling mask_api_keys_and_secrets (arguments: text)</text>
    <text x="64" y="518" fill="#8b949e">[MCP] mask_api_keys_and_secrets completed; result content withheld.</text>
    <text x="64" y="554" fill="#79c0ff">[MCP] Calling mask_pii_data (arguments: text)</text>
    <text x="64" y="578" fill="#8b949e">[MCP] mask_pii_data completed; result content withheld.</text>
    <text x="64" y="618" fill="#7ee787">Sanitized text: Contact [REDACTED_EMAIL] at [REDACTED_PHONE];</text>
    <text x="64" y="642" fill="#7ee787">               test key [REDACTED_SECRET].</text>
  </g>
</svg>
